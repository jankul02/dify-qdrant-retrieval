settings:
  - name: qdrant_url
    type: text-input
    required: true
    default: "http://host.docker.internal:6334"
    label:
      en_US: Qdrant URL
    placeholder:
      en_US: http://host.docker.internal:6334
    helper:
      en_US: "REST URL of your Qdrant instance. Use host.docker.internal to reach a service running on the Docker host machine."
  - name: qdrant_api_key
    type: secret-input
    required: true
    default: "difyai123456"
    label:
      en_US: Qdrant API Key
    placeholder:
      en_US: Enter Qdrant API key
    helper:
      en_US: "Qdrant API key. The default dev key is difyai123456 — change this in production."
  - name: collection
    type: text-input
    required: true
    default: "pdf_pages_vision"
    label:
      en_US: Collection Name
    placeholder:
      en_US: pdf_pages_vision
    helper:
      en_US: "Name of the Qdrant collection that holds your document vectors."
  - name: ollama_url
    type: text-input
    required: true
    default: "http://host.docker.internal:11434"
    label:
      en_US: Ollama URL
    placeholder:
      en_US: http://host.docker.internal:11434
    helper:
      en_US: "URL of your Ollama instance. Used only for embedding the query — no LLM is involved."
  - name: embed_model
    type: text-input
    required: true
    default: "nomic-embed-text:latest"
    label:
      en_US: Embedding Model
    placeholder:
      en_US: nomic-embed-text:latest
    helper:
      en_US: "MUST match the model used to index your Qdrant collection. A different model produces vectors in a different space and returns no meaningful results."
endpoints:
  - endpoints/qdrant-retrieval.yaml
