# ============================================================================
# sandbox.yaml — Devcontainer profile (generated by dev-sandbox install.sh)
# ============================================================================
#
# USE ONLY INSIDE THE DEVCONTAINER.
# host.docker.internal resolves only from inside Docker, not from the host.
# On the host, keep using your original profile (project.yaml).
#
# Source: project.yaml
# Changes applied:
#   - Ollama apiBase set to http://host.docker.internal:11434 (devcontainer bridge)
#   - Profile name suffixed with "(sandbox)" to distinguish it in the selector
#
# HOW TO ACTIVATE:
#   1. Cmd+Shift+P → "Dev Containers: Reopen in Container"
#   2. Continue panel → profile selector → choose the profile ending with "(sandbox)"
#   When you close the container and work on host, switch back to: project.yaml
#
# NOTE: On Linux hosts, verify .devcontainer/devcontainer.json runArgs contains:
#   "--add-host=host.docker.internal:host-gateway"
# ============================================================================

name: "Dify Qdrant Retrieval Plugin (sandbox)"
version: 1.0.0
schema: v1

context:
  - provider: codebase
  - provider: repo-map
    params:
      includeSignatures: false
  - provider: diff
  - provider: problems
  - provider: clipboard

rules:
  - "!start required before any work. See session-prompt.md."
  - "readFile/@filename before answering about files. No guessing."
  - "repo-map: signatures only. Use @file for implementations."
  - "Container: ALL shell via shell MCP (run_command). Never run_terminal_command. Non-interactive flags only."
models:
  - name: "olQwen3.6-Coder 27B (MXFP8)"
    provider: ollama
    apiBase: http://host.docker.internal:11434
    model: "qwen3.6:27b-coding-mxfp8"
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
      - image_input
      - vision
    defaultCompletionOptions:
      contextLength: 160000
      maxTokens: 32768
      keepAlive: 3600
      temperature: 0.1
      topP: 0.95

  - name: olqwen2.5-coder
    provider: ollama
    apiBase: http://host.docker.internal:11434
    model: "qwen2.5-coder:7b"
    roles:
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 65536
      maxTokens: 16384
      keepAlive: 3600
    promptTemplates:
      apply: json
      edit: json

  - name: Embeddings
    provider: ollama
    apiBase: http://host.docker.internal:11434
    model: "nomic-embed-text:latest"
    roles:
      - embed

  - name: bge-reranker
    provider: ollama
    apiBase: http://host.docker.internal:11434
    model: "qllama/bge-reranker-v2-m3:latest"
    roles:
      - rerank

  - name: "Fast-Apply-1.5B-v1.0"
    provider: ollama
    apiBase: http://host.docker.internal:11434
    model: "hf.co/dat-lequoc/Fast-Apply-1.5B-v1.0_GGUF:latest"
    roles:
      - apply

  - name: instinct
    provider: ollama
    apiBase: http://host.docker.internal:11434
    model: "nate/instinct"
    roles:
      - autocomplete

mcpServers:
  - name: shell
    command: mcp-shell-server
    args: []
    env:
      ALLOW_COMMANDS: "ls,cat,pwd,grep,find,git,python,pytest,make,pip,ruff,sed,awk,head,tail,wc,cut,tr,sort,uniq,diff,patch,cp,mv,mkdir,rm,touch,echo,tee,xargs,jq,curl"

docs:
  - name: Python Docs
    startUrl: https://docs.python.org/3/
    rootUrl: https://docs.python.org/
  - name: Dify Docs
    startUrl: https://docs.dify.ai/
    rootUrl: https://docs.dify.ai/
  - name: Continue Docs
    startUrl: https://docs.continue.dev/
    rootUrl: https://docs.continue.dev/
