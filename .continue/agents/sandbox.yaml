# ============================================================================
# sandbox.yaml — Devcontainer / sandbox agent profile
# ============================================================================
#
# Continue runs as a UI extension on the macOS host regardless of devcontainer.
# Ollama is therefore always reached via localhost:11434 (no apiBase needed).
# Differs from project.yaml only in: rules (shell MCP guidance) and allowed
# commands (broader set including rm, patch, curl).
# ============================================================================

name: "Dify + Python + Docker (M5 Max 128GB) (sandbox)"
version: 1.0.0
schema: v1

context:
  - provider: codebase
  - provider: repo-map
    params:
      includeSignatures: false
  - provider: diff
  - provider: problems
  - provider: clipboard

rules:
  - "!start required before any work. See session-prompt.md."
  - "readFile/@filename before answering about files. No guessing."
  - "repo-map: signatures only. Use @file for implementations."
  - "Container: ALL shell via shell MCP (run_command). Never run_terminal_command. Non-interactive flags only."
models:
  - name: "olQwen3.6-Coder 27B (MXFP8)"
    provider: ollama
    model: "qwen3.6:27b-coding-mxfp8"
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - image_input
      - vision
    defaultCompletionOptions:
      contextLength: 160000
      maxTokens: 32768
      keepAlive: 3600
      temperature: 0.1
      topP: 0.95

  - name: olqwen2.5-coder
    provider: ollama

    model: "qwen2.5-coder:7b"
    roles:
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 65536
      maxTokens: 16384
      keepAlive: 3600
    promptTemplates:
      apply: json
      edit: json

  - name: Embeddings
    provider: ollama

    model: "nomic-embed-text:latest"
    roles:
      - embed

  - name: bge-reranker
    provider: ollama

    model: "qllama/bge-reranker-v2-m3:latest"
    roles:
      - rerank

  - name: "Fast-Apply-1.5B-v1.0"
    provider: ollama

    model: "hf.co/dat-lequoc/Fast-Apply-1.5B-v1.0_GGUF:latest"
    roles:
      - apply

  - name: instinct
    provider: ollama

    model: "nate/instinct"
    roles:
      - autocomplete

mcpServers:
  - name: shell
    command: uvx
    args: ["mcp-shell-server"]
    env:
      ALLOW_COMMANDS: "ls,cat,pwd,grep,find,git,python,pytest,make,pip,ruff,sed,awk,head,tail,wc,cut,tr,sort,uniq,diff,patch,cp,mv,mkdir,rm,touch,echo,tee,xargs,jq,curl"

docs:
  - name: Python Docs
    startUrl: https://docs.python.org/3/
    rootUrl: https://docs.python.org/
  - name: FastAPI
    startUrl: https://fastapi.tiangolo.com/
    rootUrl: https://fastapi.tiangolo.com/
  - name: Dify Docs
    startUrl: https://docs.dify.ai/
    rootUrl: https://docs.dify.ai/
  - name: Docker Docs
    startUrl: https://docs.docker.com/
    rootUrl: https://docs.docker.com/
  - name: Continue Docs
    startUrl: https://docs.continue.dev/
    rootUrl: https://docs.continue.dev/
