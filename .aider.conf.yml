# ============================================================================
# .aider.conf.yml — Aider config for host and devcontainer (offline via Ollama)
# ============================================================================
#
# Works on BOTH the host and inside the devcontainer.
# Ollama endpoint is resolved automatically:
#   - Host:          http://localhost:11434  (aider default)
#   - Devcontainer:  http://host.docker.internal:11434  (via OLLAMA_API_BASE in devcontainer.json)
#
# Models are pulled from host Ollama — run `ollama list` to verify.
#
# HOW TO USE:
#   On host:
#     aider <file>                         — edit a specific file
#     aider                                — let aider pick relevant files
#     aider --model ollama/<model> <file>  — override model for this run
#   In devcontainer:
#     Same commands — OLLAMA_API_BASE routes to host Ollama automatically.
#
# NOTE: auto-commits is off — git flow goes through the session workflow (!end).
# ============================================================================

# Files loaded read-only at startup — mirrors what Claude Code and Continue load.
read:
  - .continue/rules/session-prompt.md
  - agentic/rules_common.md
  - agentic/rules_project.md
  - agentic/rules_aider.md
  - PROJECT_MAP.md
  - docs/dev/sessions/current.md

# Architect mode: big model reasons about what to change, small model applies the diffs.
architect: true

# Main model — thinks about WHAT to change
model: ollama_chat/qwen3.6:27b-coding-mxfp8

# Editor model — applies the actual diffs (Fast-Apply is purpose-built for this)
editor-model: ollama/hf.co/dat-lequoc/Fast-Apply-1.5B-v1.0_GGUF:latest

# Weak model — commit messages and trivial formatting
weak-model: ollama/qwen2.5-coder:1.5b

# Let the session workflow (!end) handle all commits.
auto-commits: false

# Only refresh the repo map when files change, not on every message.
map-refresh: auto

# Show diffs before applying so you can catch issues early.
pretty: true

# Color theme — switch to light-mode: true if on a light terminal background.
dark-mode: true
